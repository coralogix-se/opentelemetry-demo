name: Build and publish branch images

on:
  push:
    branches:
      - 2.2.0-cx
    paths:
      - 'src/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build_and_push_images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        file_tag:
          - file: ./src/accounting/Dockerfile
            tag_suffix: accounting
            setup-qemu: true
          - file: ./src/ad/Dockerfile
            tag_suffix: ad
            setup-qemu: true
          - file: ./src/cart/src/Dockerfile
            tag_suffix: cart
            setup-qemu: false
          - file: ./src/checkout/Dockerfile
            tag_suffix: checkout
            setup-qemu: true
          - file: ./src/currency/Dockerfile
            tag_suffix: currency
            setup-qemu: true
          - file: ./src/email/Dockerfile
            tag_suffix: email
            setup-qemu: true
          - file: ./src/flagd-ui/Dockerfile
            tag_suffix: flagd-ui
            setup-qemu: true
          - file: ./src/fraud-detection/Dockerfile
            tag_suffix: fraud-detection
            setup-qemu: true
          - file: ./src/frontend/Dockerfile
            tag_suffix: frontend
            setup-qemu: true
          - file: ./src/frontend-proxy/Dockerfile
            tag_suffix: frontend-proxy
            setup-qemu: true
          - file: ./src/image-provider/Dockerfile
            tag_suffix: image-provider
            setup-qemu: true
          - file: ./src/kafka/Dockerfile
            tag_suffix: kafka
            setup-qemu: true
          - file: ./src/llm/Dockerfile
            tag_suffix: llm
            setup-qemu: true
          - file: ./src/load-generator/Dockerfile
            tag_suffix: load-generator
            setup-qemu: true
          - file: ./src/opensearch/Dockerfile
            tag_suffix: opensearch
            setup-qemu: true
          - file: ./src/payment/Dockerfile
            tag_suffix: payment
            setup-qemu: true
          - file: ./src/product-catalog/Dockerfile
            tag_suffix: product-catalog
            setup-qemu: true
          - file: ./src/product-reviews/Dockerfile
            tag_suffix: product-reviews
            setup-qemu: true
          - file: ./src/quote/Dockerfile
            tag_suffix: quote
            setup-qemu: true
          - file: ./src/recommendation/Dockerfile
            tag_suffix: recommendation
            setup-qemu: true
          - file: ./src/shipping/Dockerfile
            tag_suffix: shipping
            setup-qemu: true

    steps:
      - uses: actions/checkout@v6.0.1

      - name: Load environment variables from .env file
        run: |
          if [ -f .env ]; then
            grep -vE '^\s*#|^\s*$' .env | while read -r line; do
              echo "$line" >> $GITHUB_ENV
            done
          else
            echo ".env file not found!"
            exit 1
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        if: ${{ matrix.file_tag.setup-qemu }}
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
            max-parallelism = 2

      - name: Build and push branch image
        uses: docker/build-push-action@v6.18.0
        with:
          context: ./
          file: ${{ matrix.file_tag.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            OTEL_JAVA_AGENT_VERSION=${{ env.OTEL_JAVA_AGENT_VERSION }}
            OPENTELEMETRY_CPP_VERSION=${{ env.OPENTELEMETRY_CPP_VERSION }}
            TRACETEST_IMAGE_VERSION=${{ env.TRACETEST_IMAGE_VERSION }}
          tags: |
            ghcr.io/coralogix-se/opentelemetry-demo:${{ github.ref_name }}-${{ matrix.file_tag.tag_suffix }}
            ghcr.io/coralogix-se/opentelemetry-demo:${{ github.ref_name }}-${{ github.sha }}-${{ matrix.file_tag.tag_suffix }}
          cache-from: type=gha
          cache-to: type=gha
